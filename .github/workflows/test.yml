name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: npm install --prefix packages/engine && npm test --prefix packages/engine && npm run typecheck --prefix packages/engine
      - name: Server tests
        run: npm install --prefix server && npm test --prefix server && npm run typecheck --prefix server
